# Local development database (SRS NFR-MNT-01). Production uses Neon.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: interns_ledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
