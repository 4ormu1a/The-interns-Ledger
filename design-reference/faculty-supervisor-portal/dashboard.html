<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Dashboard — The Interns Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/main.css">
<style>
  /* ─── greeting ─── */
  .greeting{margin-bottom:26px}
  .greeting h1{font-size:clamp(1.8rem,3.6vw,2.3rem);margin-bottom:4px}
  .greeting h1 .name{color:var(--green-bright)}
  .greeting p{color:var(--muted);font-size:1rem}
  .sec-label{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted-2);margin-bottom:12px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
  .sec-head h2{font-size:1.1rem}
  .sec-head a{font-size:.84rem;font-weight:700;color:var(--green-700);margin-left:auto}
  .sec-head a:hover{color:var(--green-bright)}

  /* ─── triage ─── */
  .triage{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
  .triage-item{display:flex;align-items:center;gap:16px;padding:16px 20px;
    border-radius:14px;border:1px solid transparent;transition:box-shadow .2s,transform .18s}
  .triage-item:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
  .t-urgent{background:var(--danger-bg);border-color:var(--danger-line)}
  .t-warn{background:var(--amber-bg);border-color:var(--amber-line)}
  .t-info{background:rgba(231,225,177,.45);border-color:var(--line)}
  .triage-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
  .ti-urgent{background:rgba(179,38,30,.14);color:var(--danger)}
  .ti-warn{background:rgba(224,168,0,.22);color:var(--amber)}
  .ti-info{background:rgba(13,83,14,.1);color:var(--green-700)}
  .triage-body{min-width:0;flex:1}
  .triage-title{font-size:.96rem;font-weight:700;color:var(--green-900)}
  .triage-text{font-size:.86rem;color:var(--muted);margin-top:2px;line-height:1.45}
  .triage-cta{flex:none}

  /* ─── stats ─── */
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .stat{background:rgba(231,225,177,.35);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .sk{font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted-2)}
  .stat .sv{font-size:1.3rem;font-weight:800;color:var(--green-900);margin-top:2px;letter-spacing:-.03em;line-height:1}
  .stat .sv small{font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:0}
  .stat .sd{font-size:.78rem;color:var(--muted);margin-top:4px}
  .stat .sd.good{color:var(--green-700);font-weight:600}
  .stat .sd.warn{color:var(--amber);font-weight:600}
  .stat .sd.bad{color:var(--danger);font-weight:600}

  /* ─── nav hub ─── */
  .nav-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .nav-card{display:flex;flex-direction:column;padding:20px;border-radius:14px;
    border:1px solid var(--line);background:var(--white);cursor:pointer;
    transition:box-shadow .2s,border-color .2s,transform .2s}
  .nav-card:hover{box-shadow:var(--shadow-md);border-color:rgba(8,203,0,.4);transform:translateY(-3px)}
  .nc-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;margin-bottom:14px;flex:none}
  .nc-ic-green{background:rgba(8,203,0,.12);color:var(--green-900)}
  .nc-ic-amber{background:rgba(224,168,0,.18);color:var(--amber)}
  .nc-ic-violet{background:var(--violet-bg);color:var(--violet)}
  .nc-ic-muted{background:rgba(13,83,14,.09);color:var(--green-700)}
  .nc-title{font-size:1rem;font-weight:700;color:var(--green-900);margin-bottom:4px}
  .nc-desc{font-size:.84rem;color:var(--muted);line-height:1.45;flex:1}
  .nc-meta{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .nc-badge{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px}
  .nb-ok{background:rgba(8,203,0,.14);color:var(--green-700)}
  .nb-warn{background:var(--amber-bg);color:var(--amber)}
  .nb-neutral{background:rgba(13,83,14,.08);color:var(--muted-2)}
  .nc-arrow{color:var(--muted-2);transition:color .18s,transform .18s}
  .nav-card:hover .nc-arrow{color:var(--green-bright);transform:translateX(3px)}

  /* ─── students strip ─── */
  .stu-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
  .stu-block{padding:18px 20px;border-right:1px solid var(--line)}
  .stu-block:last-child{border-right:0}
  .stu-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .q-avatar{width:34px;height:34px;border-radius:50%;background:rgba(13,83,14,.1);
    color:var(--green-900);display:grid;place-items:center;font-weight:700;font-size:.72rem;flex:none}
  .stu-top .nm{font-size:.88rem;font-weight:700;color:var(--green-900);line-height:1.2}
  .stu-top .un{font-size:.72rem;color:var(--muted-2)}
  .mini-track{
